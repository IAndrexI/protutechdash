name: Deploy protutechdash to LXC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Pull and restart protutechdash in LXC
        run: |
          TARGET_DIR="/opt/protutechdash"
          if [ ! -d "$TARGET_DIR" ]; then
            TARGET_DIR="$(pwd)"
          fi
          cd "$TARGET_DIR"
          git fetch origin main
          git reset --hard origin/main
          if [ -f package.json ]; then
            npm install --production || true
          fi
          if systemctl is-active --quiet protutechdash 2>/dev/null; then
            systemctl restart protutechdash
          fi
